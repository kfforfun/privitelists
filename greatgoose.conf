香港节点 = select,policy-select-name=[VLESS]HK DYNAMIC 02,interval=600,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=HK
台湾节点 = url-test,interval=600,tolerance=50,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=TW|TWN|Taiwan|Taipei|taiwan
日本节点 = select,policy-select-name=[HY2]JP ULTIMATE IPV6 01,interval=600,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=JP|Japan|japan|Tokyo
新加坡节点 = select,policy-select-name=[HY2]SG ULTIMATE IPV6 ONLY 02,interval=600,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=SG|Sing|sing
加拿大节点 = url-test,url=http://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5,policy-regex-filter=加拿大
美国节点 = url-test,interval=600,tolerance=50,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=US|USA|America|america|United States
英国节点 = url-test,policy-select-name=[VLESS]UK ULTIMATE 03,interval=600,tolerance=100,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=UK

