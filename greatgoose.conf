# 客户端需要执行的覆写 DNS 查询，通过默认节点转发
dns-server = https://1.1.1.1/dns-query#proxy

# 主 DNS 失败时，备用 DNS 也通过默认节点转发
fallback-dns-server = https://8.8.8.8/dns-query#proxy
ipv6 = true
prefer-ipv6 = false
dns-direct-system = false
dns-direct-fallback-proxy = true
always-ip-address = false
icmp-auto-reply = true
private-ip-answer = true
hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53
always-reject-url-rewrite = false
udp-policy-not-supported-behaviour = REJECT
block-quic = all-proxy
update-url = https://raw.githubusercontent.com/kfforfun/privitelists/refs/heads/main/greatgoose.conf

[Proxy Group]
NETFLIX = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,美国节点,policy-select-name=PROXY
TIKTOK = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,美国节点,policy-select-name=PROXY
TWITTER = select,PROXY,香港节点,台湾节点,日本节点,新加坡节点,美国节点,policy-select-name=PROXY
PAYPAL = select,DIRECT,PROXY,香港节点,台湾节点,日本节点,新加坡节点,美国节点,policy-select-name=PROXY
